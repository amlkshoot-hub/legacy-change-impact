name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pwsh7:
    name: pwsh 7 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run tests
        shell: pwsh
        run: ./tests/run-tests.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run tests
        shell: powershell
        run: ./tests/run-tests.ps1
